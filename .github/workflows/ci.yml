name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Tests use a fake embedder and fake LLM, so no API calls or model downloads.
      - name: Install test dependencies
        run: pip install numpy pypdf faiss-cpu huggingface_hub reportlab pytest
      - name: Run tests
        run: pytest -q
# Deployment: Render watches this repo and redeploys every push to main (see render.yaml).
